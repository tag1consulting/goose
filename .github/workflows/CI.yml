name: CI

on:
  push:
    branches: [ main, 'release-*' ]
  pull_request:
    branches: [ main, 'release-*' ]

env:
    RUST_BACKTRACE: 1

jobs:
  style:
    name: verify formatting and style
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v2

    - name: 🔎 Verify code formatting
      run: cargo fmt -- --check

    - name: 🔎 Verify code style
      run: cargo clippy --all-targets --all-features -- -D warnings

  # TypeScript dashboard SPA: type-check and ensure committed app.js matches the esbuild bundle.
  # Cargo embeds app.js via include_str!; it must not drift from the sources in src/.
  dashboard-ui:
    name: dashboard UI (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dashboard/static

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: src/dashboard/static/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type-check (tsc --noEmit)
      run: npm run check

    - name: Rebundle app.js with esbuild and verify no drift
      run: |
        npm run build
        if ! git diff --exit-code -- app.js; then
          echo "::error::src/dashboard/static/app.js differs from the esbuild bundle of src/. Rebuild it: cd src/dashboard/static && npm ci && npm run build"
          exit 1
        fi

    - name: Client tests (jsdom)
      run: npm test

  # The Goose Book. mdBook is pinned to commit e18773a967eb7f3f1392c831cb2caf9af9bdf5a5 on its
  # main branch, built from source, in place of the 0.5.4 release: that commit merged
  # rust-lang/mdBook PR 2706, the `canonical-site-url` setting book.toml uses to give every page a
  # <link rel="canonical">, and no release has it yet (0.5.4, of 2026-07-06, is the newest). The
  # commit still calls itself 0.5.4, so `mdbook --version` prints `mdbook v0.5.4`. When a release
  # contains the commit (`git tag --contains e18773a967eb7f3f1392c831cb2caf9af9bdf5a5` in a clone of
  # rust-lang/mdBook), move to that release's tarball at its exact version and drop the source
  # build and its cache. mdBook has no setting that turns warnings into errors, so the step fails
  # on any WARN or ERROR line in its log.
  book:
    name: build the Goose Book (mdBook)
    runs-on: ubuntu-latest
    env:
      MDBOOK_REV: e18773a967eb7f3f1392c831cb2caf9af9bdf5a5

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Cache mdBook built at the pinned commit
      id: mdbook-cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/mdbook
        key: mdbook-${{ runner.os }}-${{ env.MDBOOK_REV }}

    - name: Build mdBook at the pinned commit
      if: steps.mdbook-cache.outputs.cache-hit != 'true'
      run: cargo install --git https://github.com/rust-lang/mdBook --rev "$MDBOOK_REV" --locked mdbook

    - name: Show the mdBook build
      run: |
        echo "mdBook commit $MDBOOK_REV"
        mdbook --version

    - name: 🔎 Build the Book with no warnings
      shell: bash
      run: |
        # Pass: mdbook exits 0 and logs no WARN or ERROR line. Fail: either.
        mdbook build src/docs/goose-book 2>&1 | tee mdbook.log
        if grep -E '^\s*(WARN|ERROR)' mdbook.log; then
          echo "::error::mdbook build logged a warning or an error"
          exit 1
        fi

  build:
    name: build and run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""  # No features (minimal build)
          - "cookies"
          - "dashboard"  # Live dashboard HTTP server (opt-in; not in default)
          - "mcp"  # MCP Controller (opt-in; not in default)
          - "gaggle"  # Gaggle groundwork without the dashboard (opt-in; not in default)
          - "rustls-tls"
          - "native-tls"  # Native TLS in place of rustls and the shared verifier
          - "all-features"  # Keep existing all-features test

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    # One cache for each feature set, as each builds its own dependencies; the
    # gaggle job's also holds the protocol generator's own target folder, so
    # the check below is not a cold build.
    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: features-${{ matrix.features }}
        workspaces: |
          . -> target
          proto/gen -> target

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    # The checked in Gaggle protocol code is what proto/gaggle.proto generates.
    # The generator is its own package with a committed Cargo.lock, so no Goose
    # build compiles it and a new generator release cannot change its output.
    - name: 🔎 Gaggle protocol code is current
      if: ${{ matrix.features == 'gaggle' }}
      run: cargo run --locked --manifest-path proto/gen/Cargo.toml -- --check

    # headless_chrome's fetch feature pulled in zip 8.x. On 2026-10-16 every zip release but 9.0.3
    # was yanked, so no Goose build resolved (#753). If a new dependency needs zip, confirm it
    # resolves to an unyanked release, then remove or narrow this step.
    - name: 🔎 No zip in the dependency graph
      if: ${{ matrix.features == 'all-features' }}
      run: |
        # Pass: cargo tree finds no zip package. Fail: zip is in the graph, or cargo tree fails for another reason.
        if out=$(cargo tree --all-features -i zip 2>&1); then
          echo "$out"
          echo "::error::zip is in the dependency graph again (see the cargo tree output above). headless_chrome's fetch feature pulled in zip 8.x, and on 2026-10-16 every zip release but 9.0.3 was yanked, so no Goose build resolved (#753). If a new dependency needs zip, confirm it resolves to an unyanked release, then remove or narrow this step."
          exit 1
        fi
        if ! echo "$out" | grep -q "did not match any packages"; then
          echo "$out"
          echo "::error::cargo tree failed for a reason other than zip being absent"
          exit 1
        fi
        echo "zip is not in the dependency graph"

    - name: 🔨 Build (no default features)
      if: ${{ matrix.features == '' }}
      run: cargo build --verbose --no-default-features

    - name: 🔨 Build (specific features)
      if: ${{ matrix.features != '' && matrix.features != 'all-features' }}
      run: cargo build --verbose --no-default-features --features "${{ matrix.features }}"

    - name: 🔨 Build (all features)
      if: ${{ matrix.features == 'all-features' }}
      run: cargo build --verbose --all-features

    # The style job runs clippy with every feature only, where dead code behind the gaggle
    # feature alone does not show.
    - name: 🔎 Clippy (gaggle without dashboard)
      if: ${{ matrix.features == 'gaggle' }}
      run: cargo clippy --all-targets --no-default-features --features gaggle -- -D warnings

    - name: 📖 Docs
      if: ${{ matrix.features == 'all-features' }}
      env:
        RUSTDOCFLAGS: "-D warnings"
      run: cargo rustdoc --lib --all-features --examples

    # cargo-nextest runs each test in a process of its own, many at once, with
    # the `ci` profile in .config/nextest.toml. It runs no doc tests: cargo
    # test --doc runs those.
    - name: 🔎 Test (no default features)
      if: ${{ matrix.features == '' }}
      run: |
        cargo nextest run --verbose --profile ci --no-default-features
        cargo test --verbose --no-default-features --doc

    - name: 🔎 Test (specific features)
      if: ${{ matrix.features != '' && matrix.features != 'all-features' }}
      run: |
        cargo nextest run --verbose --profile ci --no-default-features --features "${{ matrix.features }}"
        cargo test --verbose --no-default-features --features "${{ matrix.features }}" --doc

    # Everything but the Gaggle process tests, the binary tests/gaggle.rs, which the
    # gaggle job runs: they need no other feature. Every test target, tests/gaggle.rs
    # among them, is still built here. The examples that run tests are those with
    # `test = true` in Cargo.toml, umami only.
    - name: 🔎 Test (all features)
      if: ${{ matrix.features == 'all-features' }}
      run: |
        cargo nextest run --verbose --profile ci --all-features -E 'not binary_id(goose::gaggle)'
        cargo test --verbose --all-features --doc

    # The ubuntu-latest image ships Google Chrome, which these ignored tests need.
    - name: 🔎 Test PDF reports with an installed Chrome
      if: ${{ matrix.features == 'all-features' }}
      run: cargo nextest run --verbose --profile ci --all-features --run-ignored all -E 'binary_id(goose::it) & test(/^pdf_chrome::/)'

    # Every test with `graph` in its name, and metrics_print_unlocked, which has
    # no test harness, so `cargo test graph` ran it too.
    - name: 🔎 timezone-sensitive tests in non UTC (Asia/Kolkata, UTC+05:30)
      if: ${{ matrix.features == 'all-features' }}
      env:
        TZ: Asia/Kolkata
      run: |
        cargo nextest run --verbose --profile ci --all-features -E 'test(graph) | binary_id(goose::metrics_print_unlocked)'
        cargo test --verbose --all-features --doc graph

    # An output flag given without a path, and the dashboard's Save report,
    # write into goose-runs/ in the working directory. Goose's own tests write
    # into temporary folders, never into the checkout.
    - name: 🔎 Tests wrote nothing into goose-runs
      run: |
        if [ -e goose-runs ]; then
          echo "::error::the tests wrote goose-runs/ in the checkout; give the test an --output-dir in a temporary folder"
          find goose-runs | head -50
          exit 1
        fi

  # PDF reports with an installed browser and CHROME unset, the setup in #753:
  # .github/scripts/install-arm64-chromium.sh puts chromium on PATH from the
  # first source that works (Playwright's CDN, Debian, ppa:xtradeb/apps, then the
  # snap), so one host being down, as the Snap Store was on 2026-11-11, does not
  # fail the job.
  pdf-reports-arm64:
    name: PDF report tests (arm64 Linux)
    runs-on: ubuntu-24.04-arm
    env:
      # The Chrome for Testing build the install script downloads, and caches.
      CHROMIUM_VERSION: 158.0.8127.18

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Cache Chromium
      uses: actions/cache@v4
      with:
        path: ~/.cache/ci-chromium
        key: chromium-${{ env.CHROMIUM_VERSION }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install Chromium
      timeout-minutes: 15
      run: |
        .github/scripts/install-arm64-chromium.sh
        # Pass: Goose can find chromium on PATH. Fail: it is not there.
        command -v chromium
        chromium --version

    - name: 🔎 Test PDF reports
      run: cargo nextest run --verbose --profile ci --features pdf-reports --test it -E 'test(/^pdf_reports::/)'

    # These tests set CHROME, so they download nothing.
    - name: 🔎 Test Chrome failures with the installed Chromium
      run: cargo nextest run --verbose --profile ci --features pdf-reports --test it --run-ignored all -E 'test(/^pdf_chrome::/)'

    - name: 🔎 Installed Chromium was used
      run: |
        # Pass: nothing was downloaded. Fail: Goose missed the installed browser.
        if [ -e ~/.cache/goose/chrome ]; then
          ls -R ~/.cache/goose/chrome | head -20
          echo "::error::Goose downloaded Chrome although Chromium is installed"
          exit 1
        fi

  # PDF reports with no browser installed: Goose downloads Chrome for Testing.
  pdf-reports-download:
    name: PDF report tests (Chrome download, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Remove the installed browsers
      run: |
        # Every name headless_chrome looks for on PATH; the runner image ships Chrome and Edge.
        names="google-chrome-stable google-chrome-beta google-chrome-dev google-chrome-unstable google-chrome
          chromium chromium-browser microsoft-edge-stable microsoft-edge-beta microsoft-edge-dev
          chrome chrome-browser msedge microsoft-edge"
        for name in $names; do
          for path in $(which -a "$name"); do
            echo "removing $path"
            sudo rm -f "$path"
          done
        done
        hash -r
        # Pass: none of the names resolve. Fail: a browser is still on PATH.
        for name in $names; do
          if command -v "$name"; then
            echo "::error::$name is still on PATH"
            exit 1
          fi
        done

    - name: 🔎 Test PDF reports
      run: cargo nextest run --verbose --profile ci --features pdf-reports --test it -E 'test(/^pdf_reports::/)'

    - name: 🔎 Chrome was downloaded
      run: |
        # Pass: a downloaded headless shell is in Goose's cache. Fail: the tests used some other browser.
        if ! ls ~/.cache/goose/chrome/*-${{ matrix.platform }}/chrome-headless-shell-${{ matrix.platform }}/chrome-headless-shell; then
          echo "::error::the PDF tests passed without downloading Chrome for Testing"
          exit 1
        fi
