name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
    RUST_BACKTRACE: 1

jobs:
  style:
    name: verify formatting and style
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v1.3.0
    
    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
    
    - name: 🔎 Verify code formatting
      uses: actions-rs/cargo@v1
      with:
        command: fmt 
        args: -- --check
    
    - name: 🔎 Verify code style
      uses: actions-rs/cargo@v1
      with:
        command: clippy 
        args: --all-targets --all-features -- -D warnings

  # TypeScript dashboard SPA: type-check and ensure committed app.js matches the esbuild bundle.
  # Cargo embeds app.js via include_str!; it must not drift from the sources in src/.
  dashboard-ui:
    name: dashboard UI (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dashboard/static

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: src/dashboard/static/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type-check (tsc --noEmit)
      run: npm run check

    - name: Rebundle app.js with esbuild and verify no drift
      run: |
        npm run build
        if ! git diff --exit-code -- app.js; then
          echo "::error::src/dashboard/static/app.js differs from the esbuild bundle of src/. Rebuild it: cd src/dashboard/static && npm ci && npm run build"
          exit 1
        fi

    - name: Client tests (jsdom)
      run: npm test

  build:
    name: build and run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""  # No features (minimal build)
          - "cookies"
          - "dashboard"  # Live dashboard HTTP server (opt-in; not in default)
          - "rustls-tls"
          - "all-features"  # Keep existing all-features test

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v1.3.0
    
    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
    
    # headless_chrome's fetch feature pulled in zip 8.x. On 2026-10-16 every zip release but 9.0.3
    # was yanked, so no Goose build resolved (#753). If a new dependency needs zip, confirm it
    # resolves to an unyanked release, then remove or narrow this step.
    - name: 🔎 No zip in the dependency graph
      if: ${{ matrix.features == 'all-features' }}
      run: |
        # Pass: cargo tree finds no zip package. Fail: zip is in the graph, or cargo tree fails for another reason.
        if out=$(cargo tree --all-features -i zip 2>&1); then
          echo "$out"
          echo "::error::zip is in the dependency graph again (see the cargo tree output above). headless_chrome's fetch feature pulled in zip 8.x, and on 2026-10-16 every zip release but 9.0.3 was yanked, so no Goose build resolved (#753). If a new dependency needs zip, confirm it resolves to an unyanked release, then remove or narrow this step."
          exit 1
        fi
        if ! echo "$out" | grep -q "did not match any packages"; then
          echo "$out"
          echo "::error::cargo tree failed for a reason other than zip being absent"
          exit 1
        fi
        echo "zip is not in the dependency graph"

    - name: 🔨 Build (no default features)
      if: ${{ matrix.features == '' }}
      uses: actions-rs/cargo@v1
      with:
        command: build 
        args: --verbose --no-default-features
    
    - name: 🔨 Build (specific features)
      if: ${{ matrix.features != '' && matrix.features != 'all-features' }}
      uses: actions-rs/cargo@v1
      with:
        command: build 
        args: --verbose --no-default-features --features "${{ matrix.features }}"
    
    - name: 🔨 Build (all features)
      if: ${{ matrix.features == 'all-features' }}
      uses: actions-rs/cargo@v1
      with:
        command: build 
        args: --verbose --all-features
    
    - name: 📖 Docs
      if: ${{ matrix.features == 'all-features' }}
      env:
        RUSTDOCFLAGS: "-D warnings"
      uses: actions-rs/cargo@v1
      with:
        command: rustdoc 
        args: --lib --all-features --examples
    
    - name: 🔎 Test (no default features)
      if: ${{ matrix.features == '' }}
      uses: actions-rs/cargo@v1
      with:
        command: test 
        args: --verbose --no-default-features
    
    - name: 🔎 Test (specific features)
      if: ${{ matrix.features != '' && matrix.features != 'all-features' }}
      uses: actions-rs/cargo@v1
      with:
        command: test 
        args: --verbose --no-default-features --features "${{ matrix.features }}"
    
    - name: 🔎 Test (all features)
      if: ${{ matrix.features == 'all-features' }}
      uses: actions-rs/cargo@v1
      with:
        command: test 
        args: --verbose --all-features
    
    # The ubuntu-latest image ships Google Chrome, which these ignored tests need.
    - name: 🔎 Test PDF reports with an installed Chrome
      if: ${{ matrix.features == 'all-features' }}
      run: cargo test --verbose --all-features --test pdf_chrome -- --include-ignored

    - name: 🔎 timezone-sensitive tests in non UTC (GMT-5)
      if: ${{ matrix.features == 'all-features' }}
      uses: actions-rs/cargo@v1
      env:
        TZ: std +5
      with:
        command: test 
        args: --verbose --all-features graph

    # Goose saves every run to goose-runs/ by default; its own tests must not.
    - name: 🔎 Tests wrote no saved runs
      run: |
        if [ -e goose-runs ]; then
          echo "::error::the tests wrote goose-runs/ in the checkout; set --no-save or GooseDefault::NoSave where they build a configuration"
          find goose-runs | head -50
          exit 1
        fi

  # PDF reports with an installed browser and CHROME unset, the setup in #753:
  # Google ships no arm64 Linux Chrome, so this job installs Chromium.
  pdf-reports-arm64:
    name: PDF report tests (arm64 Linux)
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v1.3.0

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable

    - name: Install Chromium
      run: |
        sudo snap install chromium
        # Pass: Goose can find chromium on PATH. Fail: it is not there.
        command -v chromium
        chromium --version

    - name: 🔎 Test PDF reports
      run: cargo test --verbose --features pdf-reports --test pdf_reports

    # These tests set CHROME, so they download nothing.
    - name: 🔎 Test Chrome failures with the installed Chromium
      run: cargo test --verbose --features pdf-reports --test pdf_chrome -- --include-ignored

    - name: 🔎 Installed Chromium was used
      run: |
        # Pass: nothing was downloaded. Fail: Goose missed the installed browser.
        if [ -e ~/.cache/goose/chrome ]; then
          ls -R ~/.cache/goose/chrome | head -20
          echo "::error::Goose downloaded Chrome although Chromium is installed"
          exit 1
        fi

  # PDF reports with no browser installed: Goose downloads Chrome for Testing.
  pdf-reports-download:
    name: PDF report tests (Chrome download, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v1.3.0

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable

    - name: Remove the installed browsers
      run: |
        # Every name headless_chrome looks for on PATH; the runner image ships Chrome and Edge.
        names="google-chrome-stable google-chrome-beta google-chrome-dev google-chrome-unstable google-chrome
          chromium chromium-browser microsoft-edge-stable microsoft-edge-beta microsoft-edge-dev
          chrome chrome-browser msedge microsoft-edge"
        for name in $names; do
          for path in $(which -a "$name"); do
            echo "removing $path"
            sudo rm -f "$path"
          done
        done
        hash -r
        # Pass: none of the names resolve. Fail: a browser is still on PATH.
        for name in $names; do
          if command -v "$name"; then
            echo "::error::$name is still on PATH"
            exit 1
          fi
        done

    - name: 🔎 Test PDF reports
      run: cargo test --verbose --features pdf-reports --test pdf_reports

    - name: 🔎 Chrome was downloaded
      run: |
        # Pass: a downloaded headless shell is in Goose's cache. Fail: the tests used some other browser.
        if ! ls ~/.cache/goose/chrome/*-${{ matrix.platform }}/chrome-headless-shell-${{ matrix.platform }}/chrome-headless-shell; then
          echo "::error::the PDF tests passed without downloading Chrome for Testing"
          exit 1
        fi
