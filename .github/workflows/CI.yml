name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
    RUST_BACKTRACE: 1

jobs:
  style:
    name: verify formatting and style
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v1.3.0
    
    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
    
    - name: 🔎 Verify code formatting
      uses: actions-rs/cargo@v1
      with:
        command: fmt 
        args: -- --check
    
    - name: 🔎 Verify code style
      uses: actions-rs/cargo@v1
      with:
        command: clippy 
        args: --all-targets --all-features -- -D warnings

  # TypeScript dashboard SPA: type-check and ensure committed app.js matches tsc output.
  # Cargo embeds app.js via include_str!; it must not drift from app.ts.
  dashboard-ui:
    name: dashboard UI (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dashboard/static

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: src/dashboard/static/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type-check (tsc --noEmit)
      run: npm run check

    - name: Rebuild app.js and verify no drift
      run: |
        npm run build
        if ! git diff --exit-code -- app.js; then
          echo "::error::src/dashboard/static/app.js is out of date. Run: cd src/dashboard/static && npm ci && npm run build"
          exit 1
        fi

  build:
    name: build and run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""  # No features (minimal build)
          - "cookies"
          - "rustls-tls"
          - "all-features"  # Keep existing all-features test

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v1.3.0
    
    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
    
    - name: 🔨 Build (no default features)
      if: ${{ matrix.features == '' }}
      uses: actions-rs/cargo@v1
      with:
        command: build 
        args: --verbose --no-default-features
    
    - name: 🔨 Build (specific features)
      if: ${{ matrix.features != '' && matrix.features != 'all-features' }}
      uses: actions-rs/cargo@v1
      with:
        command: build 
        args: --verbose --no-default-features --features "${{ matrix.features }}"
    
    - name: 🔨 Build (all features)
      if: ${{ matrix.features == 'all-features' }}
      uses: actions-rs/cargo@v1
      with:
        command: build 
        args: --verbose --all-features
    
    - name: 📖 Docs
      if: ${{ matrix.features == 'all-features' }}
      uses: actions-rs/cargo@v1
      with:
        command: rustdoc 
        args: --lib --all-features --examples
    
    - name: 🔎 Test (no default features)
      if: ${{ matrix.features == '' }}
      uses: actions-rs/cargo@v1
      with:
        command: test 
        args: --verbose --no-default-features
    
    - name: 🔎 Test (specific features)
      if: ${{ matrix.features != '' && matrix.features != 'all-features' }}
      uses: actions-rs/cargo@v1
      with:
        command: test 
        args: --verbose --no-default-features --features "${{ matrix.features }}"
    
    - name: 🔎 Test (all features)
      if: ${{ matrix.features == 'all-features' }}
      uses: actions-rs/cargo@v1
      with:
        command: test 
        args: --verbose --all-features
    
    - name: 🔎 timezone-sensitive tests in non UTC (GMT-5)
      if: ${{ matrix.features == 'all-features' }}
      uses: actions-rs/cargo@v1
      env:
        TZ: std +5
      with:
        command: test 
        args: --verbose --all-features graph
