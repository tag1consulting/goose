name: CI

on:
  push:
    branches: [ main, 'release-*' ]
  pull_request:
    branches: [ main, 'release-*' ]

env:
    RUST_BACKTRACE: 1

jobs:
  style:
    name: verify formatting and style
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v2

    - name: 🔎 Verify code formatting
      run: cargo fmt -- --check

    - name: 🔎 Verify code style
      run: cargo clippy --all-targets --all-features -- -D warnings

  # TypeScript dashboard SPA: type-check and ensure committed app.js matches the esbuild bundle.
  # Cargo embeds app.js via include_str!; it must not drift from the sources in src/.
  dashboard-ui:
    name: dashboard UI (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dashboard/static

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: src/dashboard/static/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type-check (tsc --noEmit)
      run: npm run check

    - name: Rebundle app.js with esbuild and verify no drift
      run: |
        npm run build
        if ! git diff --exit-code -- app.js; then
          echo "::error::src/dashboard/static/app.js differs from the esbuild bundle of src/. Rebuild it: cd src/dashboard/static && npm ci && npm run build"
          exit 1
        fi

    - name: Client tests (jsdom)
      run: npm test

  # The Goose Book. mdBook is pinned to commit e18773a967eb7f3f1392c831cb2caf9af9bdf5a5 on its
  # main branch, built from source, in place of the 0.5.4 release: that commit merged
  # rust-lang/mdBook PR 2706, the `canonical-site-url` setting book.toml uses to give every page a
  # <link rel="canonical">, and no release has it yet (0.5.4, of 2026-07-06, is the newest). The
  # commit still calls itself 0.5.4, so `mdbook --version` prints `mdbook v0.5.4`. When a release
  # contains the commit (`git tag --contains e18773a967eb7f3f1392c831cb2caf9af9bdf5a5` in a clone of
  # rust-lang/mdBook), move to that release's tarball at its exact version and drop the source
  # build and its cache. mdBook has no setting that turns warnings into errors, so the step fails
  # on any WARN or ERROR line in its log.
  book:
    name: build the Goose Book (mdBook)
    runs-on: ubuntu-latest
    env:
      MDBOOK_REV: e18773a967eb7f3f1392c831cb2caf9af9bdf5a5

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Cache mdBook built at the pinned commit
      id: mdbook-cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/mdbook
        key: mdbook-${{ runner.os }}-${{ env.MDBOOK_REV }}

    - name: Build mdBook at the pinned commit
      if: steps.mdbook-cache.outputs.cache-hit != 'true'
      run: cargo install --git https://github.com/rust-lang/mdBook --rev "$MDBOOK_REV" --locked mdbook

    - name: Show the mdBook build
      run: |
        echo "mdBook commit $MDBOOK_REV"
        mdbook --version

    - name: 🔎 Build the Book with no warnings
      shell: bash
      run: |
        # Pass: mdbook exits 0 and logs no WARN or ERROR line. Fail: either.
        mdbook build src/docs/goose-book 2>&1 | tee mdbook.log
        if grep -E '^\s*(WARN|ERROR)' mdbook.log; then
          echo "::error::mdbook build logged a warning or an error"
          exit 1
        fi

  build:
    name: build and run tests
    runs-on: ubuntu-latest
    env:
      # The tests the gaggle job runs, with no other feature, and the all-features
      # job leaves to it: the Gaggle process tests, the binary tests/gaggle.rs, and
      # the Gaggle library tests, those in src/ that exist only with the gaggle
      # feature: every test in `gaggle::` and the nine named outside it. The three
      # `gaggle::run_tests` tests named last also need the dashboard feature, so
      # they exist only with all features and stay there. A new test in src/gaggle/
      # that needs another feature as well, `#[cfg(feature = "dashboard")]` say,
      # must be added to that list; the all-features job fails until it is.
      GAGGLE_JOB_TESTS: >-
        binary_id(goose::gaggle)
        | (binary_id(goose) & (test(/^gaggle::/)
        | test(/^(tests::gaggle_(ordinals_match_one_process|shadow_merge_runs_in_execute|worker_share_of_another_size_fails_to_launch|worker_slice_sets_its_share|worker_users_start_at_offset)|controller::tests::test_control_gaggle_manager_applies_changes_and_answers_metrics|goose::tests::gaggle_whole_run_figures_match_a_reference|metrics::test::gaggle_(earliest_second_covers_every_arm|second_pass_has_no_side_effects))$/))
        & not test(/^gaggle::run_tests::(gaggle_dashboard_shows_the_workers|gaggle_manager_failing_to_start_its_run_runs_test_stop|gaggle_runtime_control_in_one_process)$/))
    strategy:
      matrix:
        features:
          - ""  # No features (minimal build)
          - "cookies"
          - "dashboard"  # Live dashboard HTTP server (opt-in; not in default)
          - "mcp"  # MCP Controller (opt-in; not in default)
          - "gaggle"  # Gaggle groundwork without the dashboard (opt-in; not in default)
          - "rustls-tls"
          - "native-tls"  # Native TLS in place of rustls and the shared verifier
          - "all-features"  # Keep existing all-features test
        # The core suite, every test that exists with no feature, runs in two jobs:
        # "" (no features) and all-features, which runs it with every feature on at
        # once. Only those two run the doc tests: the doc test list is the same for
        # every feature set, and they compile each doc test with its features off and
        # on. The gaggle job runs GAGGLE_JOB_TESTS only, the tests the gaggle feature
        # adds. Each of the other single feature jobs runs only `tests`, a nextest
        # filter of the tests whose code path the feature changes; all-features runs
        # every other test with the feature on. The filters are derived as follows;
        # keep them current the same way:
        #
        # - Every test that exists only with the feature: `cargo nextest list` with
        #   the job's flags, less the list with --no-default-features. Such a test
        #   sits behind `#[cfg(feature = "...")]`; one in a module not named below
        #   must be added to the filter, or it runs in all-features only.
        # - Every test in a module whose source branches on the feature with cfg,
        #   apart from code the feature runs only when its option is given (the
        #   dashboard and MCP servers start only with --dashboard and --mcp). When
        #   you add a `cfg(feature = "...")` to a file, add that file's tests: in
        #   the library `client::` for src/client.rs, `controller::` for
        #   src/controller.rs, `tests::` for src/lib.rs; in tests/it/ the file's
        #   module name.
        # - cookies: the tests that build or configure a client or check what a
        #   request carries; cookies only gives each user's client a cookie jar.
        #   native-tls and rustls-tls: the tests that build a client, check its TLS
        #   or HTTP version, or make an HTTPS connection; rustls-tls also changes
        #   tokio-tungstenite, so it adds the tests that open a WebSocket. Every
        #   other test that builds a client or sends a request runs with all three
        #   features on in all-features.
        #
        # A test in a module a filter names is in the job on its own, so a new test
        # in tests/it/session.rs, say, needs no change here.
        include:
          - features: "cookies"
            tests: >-
              (binary_id(goose) & test(/^(client|goose|tests)::/))
              | (binary_id(goose::it) & test(/^(client_builder|session|http_version|http2|tls_roots|redirect|request_headers|custom_request|clone_user_with_session_data)::/))
          - features: "dashboard"
            tests: >-
              (binary_id(goose) & test(/^(dashboard|serve|controller|config|runs|run_shape|metrics|tests)::/))
              | (binary_id(goose::it) & test(/^(dashboard|dashboard_goose_log|dashboard_no_folder|gzip_goose_log_dashboard|throttle_live|controller|control_agreement|controller_bind|controller_no_autostart)::/))
          - features: "mcp"
            tests: >-
              (binary_id(goose) & test(/^(controller|serve|config|runs|tests)::/))
              | (binary_id(goose::it) & test(/^(mcp_controller|controller|control_agreement|controller_bind|controller_no_autostart)::/))
          - features: "rustls-tls"
            tests: >-
              (binary_id(goose) & test(/^(client|goose|tests|controller)::/))
              | (binary_id(goose::it) & test(/^(client_builder|tls_roots|http2|http_version|controller|control_agreement)::/))
          - features: "native-tls"
            tests: >-
              (binary_id(goose) & test(/^(client|goose|tests)::/))
              | (binary_id(goose::it) & test(/^(client_builder|tls_roots|http2|http_version)::/))

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    # One cache for each feature set, as each builds its own dependencies; the
    # gaggle job's also holds the protocol generator's own target folder, so
    # the check below is not a cold build.
    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: features-${{ matrix.features }}
        workspaces: |
          . -> target
          proto/gen -> target

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    # The checked in Gaggle protocol code is what proto/gaggle.proto generates.
    # The generator is its own package with a committed Cargo.lock, so no Goose
    # build compiles it and a new generator release cannot change its output.
    - name: 🔎 Gaggle protocol code is current
      if: ${{ matrix.features == 'gaggle' }}
      run: cargo run --locked --manifest-path proto/gen/Cargo.toml -- --check

    # headless_chrome's fetch feature pulled in zip 8.x. On 2026-10-16 every zip release but 9.0.3
    # was yanked, so no Goose build resolved (#753). If a new dependency needs zip, confirm it
    # resolves to an unyanked release, then remove or narrow this step.
    - name: 🔎 No zip in the dependency graph
      if: ${{ matrix.features == 'all-features' }}
      run: |
        # Pass: cargo tree finds no zip package. Fail: zip is in the graph, or cargo tree fails for another reason.
        if out=$(cargo tree --all-features -i zip 2>&1); then
          echo "$out"
          echo "::error::zip is in the dependency graph again (see the cargo tree output above). headless_chrome's fetch feature pulled in zip 8.x, and on 2026-10-16 every zip release but 9.0.3 was yanked, so no Goose build resolved (#753). If a new dependency needs zip, confirm it resolves to an unyanked release, then remove or narrow this step."
          exit 1
        fi
        if ! echo "$out" | grep -q "did not match any packages"; then
          echo "$out"
          echo "::error::cargo tree failed for a reason other than zip being absent"
          exit 1
        fi
        echo "zip is not in the dependency graph"

    - name: 🔨 Build (no default features)
      if: ${{ matrix.features == '' }}
      run: cargo build --verbose --no-default-features

    - name: 🔨 Build (specific features)
      if: ${{ matrix.features != '' && matrix.features != 'all-features' }}
      run: cargo build --verbose --no-default-features --features "${{ matrix.features }}"

    - name: 🔨 Build (all features)
      if: ${{ matrix.features == 'all-features' }}
      run: cargo build --verbose --all-features

    # The style job runs clippy with every feature only, where dead code behind the gaggle
    # feature alone does not show.
    - name: 🔎 Clippy (gaggle without dashboard)
      if: ${{ matrix.features == 'gaggle' }}
      run: cargo clippy --all-targets --no-default-features --features gaggle -- -D warnings

    - name: 📖 Docs
      if: ${{ matrix.features == 'all-features' }}
      env:
        RUSTDOCFLAGS: "-D warnings"
      run: cargo rustdoc --lib --all-features --examples

    # cargo-nextest runs each test in a process of its own, many at once, with
    # the `ci` profile in .config/nextest.toml. It runs no doc tests: cargo
    # test --doc runs those.
    - name: 🔎 Test (no default features)
      if: ${{ matrix.features == '' }}
      run: |
        cargo nextest run --verbose --profile ci --no-default-features
        cargo test --verbose --no-default-features --doc

    # Only the tests the gaggle feature adds, GAGGLE_JOB_TESTS at the top of this
    # job: the Gaggle library tests and the Gaggle process tests. The core suite
    # runs in the "" and all-features jobs, and so do the doc tests, whose list is
    # the same for every feature set. Every test target is still built.
    - name: 🔎 Test (gaggle)
      if: ${{ matrix.features == 'gaggle' }}
      run: cargo nextest run --verbose --profile ci --no-default-features --features gaggle -E "$GAGGLE_JOB_TESTS"

    # Only the tests the feature adds or changes: the matrix's `tests` filter,
    # whose comment above says how it is derived. Every test target is still built.
    - name: 🔎 Test (what the feature adds or changes)
      if: ${{ matrix.tests }}
      env:
        TESTS: ${{ matrix.tests }}
      run: cargo nextest run --verbose --profile ci --no-default-features --features "${{ matrix.features }}" -E "$TESTS"

    # Everything but what the gaggle job runs and needs no other feature: the Gaggle
    # process tests and the Gaggle library tests, GAGGLE_JOB_TESTS at the top of this
    # job. Every test target, tests/gaggle.rs among them, is still built here. The
    # examples that run tests are those with `test = true` in Cargo.toml, umami only.
    - name: 🔎 Test (all features)
      if: ${{ matrix.features == 'all-features' }}
      run: |
        cargo nextest run --verbose --profile ci --all-features -E "not ($GAGGLE_JOB_TESTS)"
        cargo test --verbose --all-features --doc

    # A test GAGGLE_JOB_TESTS matches that also needs a feature other than gaggle
    # exists only in this build, and the step above would leave it to a job that
    # does not have it. This lists what the filter matches here and what the gaggle
    # job's build has, the library and tests/gaggle.rs built with gaggle alone, and
    # fails naming any test missing from the second.
    - name: 🔎 Every test left to the gaggle job is in it
      if: ${{ matrix.features == 'all-features' }}
      run: |
        cargo nextest list --all-features --run-ignored all --lib --test gaggle \
          -E "$GAGGLE_JOB_TESTS" --message-format json > "$RUNNER_TEMP/left-to-gaggle.json"
        cargo nextest list --no-default-features --features gaggle --run-ignored all --lib --test gaggle \
          --message-format json > "$RUNNER_TEMP/gaggle-job.json"
        python3 - "$RUNNER_TEMP/left-to-gaggle.json" "$RUNNER_TEMP/gaggle-job.json" <<'EOF'
        import json, sys
        def tests(path, matching):
            suites = json.load(open(path))["rust-suites"]
            return {(binary, name) for binary, suite in suites.items()
                    for name, test in suite["testcases"].items()
                    if not matching or test["filter-match"]["status"] == "matches"}
        left, gaggle = tests(sys.argv[1], True), tests(sys.argv[2], False)
        missing = sorted(left - gaggle)
        for binary, name in missing:
            print(f"::error::{binary} {name} is left to the gaggle job, which does not have it: "
                  "add it to the tests GAGGLE_JOB_TESTS keeps in the all-features job")
        if not left:
            print("::error::GAGGLE_JOB_TESTS matches no test")
        print(f"{len(left)} tests left to the gaggle job, {len(missing)} of them missing from it")
        sys.exit(1 if missing or not left else 0)
        EOF

    # The ubuntu-latest image ships Google Chrome, which these ignored tests need.
    - name: 🔎 Test PDF reports with an installed Chrome
      if: ${{ matrix.features == 'all-features' }}
      run: cargo nextest run --verbose --profile ci --all-features --run-ignored all -E 'binary_id(goose::it) & test(/^pdf_chrome::/)'

    # Every test with `graph` in its name, and metrics_print_unlocked, which has
    # no test harness, so `cargo test graph` ran it too.
    - name: 🔎 timezone-sensitive tests in non UTC (GMT-5)
      if: ${{ matrix.features == 'all-features' }}
      env:
        TZ: std +5
      run: |
        cargo nextest run --verbose --profile ci --all-features -E 'test(graph) | binary_id(goose::metrics_print_unlocked)'
        cargo test --verbose --all-features --doc graph

    # An output flag given without a path, and the dashboard's Save report,
    # write into goose-runs/ in the working directory. Goose's own tests write
    # into temporary folders, never into the checkout.
    - name: 🔎 Tests wrote nothing into goose-runs
      run: |
        if [ -e goose-runs ]; then
          echo "::error::the tests wrote goose-runs/ in the checkout; give the test an --output-dir in a temporary folder"
          find goose-runs | head -50
          exit 1
        fi

  # PDF reports with an installed browser and CHROME unset, the setup in #753:
  # .github/scripts/install-arm64-chromium.sh puts chromium on PATH from the
  # first source that works (Playwright's CDN, Debian, ppa:xtradeb/apps, then the
  # snap), so one host being down, as the Snap Store was on 2026-11-11, does not
  # fail the job.
  pdf-reports-arm64:
    name: PDF report tests (arm64 Linux)
    runs-on: ubuntu-24.04-arm
    env:
      # The Chrome for Testing build the install script downloads, and caches.
      CHROMIUM_VERSION: 158.0.8127.18

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Cache Chromium
      uses: actions/cache@v4
      with:
        path: ~/.cache/ci-chromium
        key: chromium-${{ env.CHROMIUM_VERSION }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install Chromium
      timeout-minutes: 15
      run: |
        .github/scripts/install-arm64-chromium.sh
        # Pass: Goose can find chromium on PATH. Fail: it is not there.
        command -v chromium
        chromium --version

    - name: 🔎 Test PDF reports
      run: cargo nextest run --verbose --profile ci --features pdf-reports --test it -E 'test(/^pdf_reports::/)'

    # These tests set CHROME, so they download nothing.
    - name: 🔎 Test Chrome failures with the installed Chromium
      run: cargo nextest run --verbose --profile ci --features pdf-reports --test it --run-ignored all -E 'test(/^pdf_chrome::/)'

    - name: 🔎 Installed Chromium was used
      run: |
        # Pass: nothing was downloaded. Fail: Goose missed the installed browser.
        if [ -e ~/.cache/goose/chrome ]; then
          ls -R ~/.cache/goose/chrome | head -20
          echo "::error::Goose downloaded Chrome although Chromium is installed"
          exit 1
        fi

  # PDF reports with no browser installed: Goose downloads Chrome for Testing.
  pdf-reports-download:
    name: PDF report tests (Chrome download, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Remove the installed browsers
      run: |
        # Every name headless_chrome looks for on PATH; the runner image ships Chrome and Edge.
        names="google-chrome-stable google-chrome-beta google-chrome-dev google-chrome-unstable google-chrome
          chromium chromium-browser microsoft-edge-stable microsoft-edge-beta microsoft-edge-dev
          chrome chrome-browser msedge microsoft-edge"
        for name in $names; do
          for path in $(which -a "$name"); do
            echo "removing $path"
            sudo rm -f "$path"
          done
        done
        hash -r
        # Pass: none of the names resolve. Fail: a browser is still on PATH.
        for name in $names; do
          if command -v "$name"; then
            echo "::error::$name is still on PATH"
            exit 1
          fi
        done

    - name: 🔎 Test PDF reports
      run: cargo nextest run --verbose --profile ci --features pdf-reports --test it -E 'test(/^pdf_reports::/)'

    - name: 🔎 Chrome was downloaded
      run: |
        # Pass: a downloaded headless shell is in Goose's cache. Fail: the tests used some other browser.
        if ! ls ~/.cache/goose/chrome/*-${{ matrix.platform }}/chrome-headless-shell-${{ matrix.platform }}/chrome-headless-shell; then
          echo "::error::the PDF tests passed without downloading Chrome for Testing"
          exit 1
        fi
